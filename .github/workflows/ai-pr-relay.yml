name: AI PR Relay

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    if: github.event.label.name == 'ai:needs-review' && contains(github.event.pull_request.labels.*.name, 'ai:origin-codex')
    runs-on: ubuntu-latest
    steps:
      - name: Check Claude secret visibility
        env:
          CLAUDE_KEY: ${{ secrets.CINDER_GITHUB_CLAUDE }}
        run: |
          if [ -n "$CLAUDE_KEY" ]; then
            echo "CINDER_GITHUB_CLAUDE is PRESENT"
          else
            echo "CINDER_GITHUB_CLAUDE is MISSING"
            exit 1
          fi

      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Claude reviews Codex PR
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CINDER_GITHUB_CLAUDE }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} as an independent code reviewer.
            Inspect the complete diff against ${{ github.event.pull_request.base.ref }}.
            Do not edit files, post comments, or merge the pull request.
            Focus on correctness, regressions, security/privacy, tests, and maintainability.
            Return a concise GitHub-ready review as your final response.
            Clearly separate blocking findings from optional suggestions.
            If there are no blocking findings, explicitly say: AI_REVIEW_APPROVED
            If there are blocking findings, explicitly say: AI_REVIEW_CHANGES_REQUESTED

      - name: Post Claude review to PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "Claude execution file is unavailable"
            exit 1
          fi

          REVIEW=$(jq -r '
            ([.[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | map(select(length > 0)) | last)
            // ([.[] | select(.type == "result") | .result? | select(type == "string" and length > 0)] | last)
            // empty
          ' "$EXECUTION_FILE")

          if [ -z "$REVIEW" ]; then
            echo "Could not extract Claude review text"
            exit 1
          fi

          {
            echo "## Claude AI Review"
            echo
            echo "$REVIEW"
            echo
            echo "---"
            echo "Automated review generated by the Cinder AI PR Relay. Human merge approval is still required."
          } > /tmp/claude-review.md

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claude-review.md

  codex-review:
    if: github.event.label.name == 'ai:needs-review' && contains(github.event.pull_request.labels.*.name, 'ai:origin-claude')
    runs-on: ubuntu-latest
    steps:
      - name: Check Codex secret visibility
        env:
          CODEX_KEY: ${{ secrets.CINDER_GITHUB_CODEX }}
        run: |
          if [ -n "$CODEX_KEY" ]; then
            echo "CINDER_GITHUB_CODEX is PRESENT"
          else
            echo "CINDER_GITHUB_CODEX is MISSING"
            exit 1
          fi

      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Codex reviews Claude PR
        id: codex_review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CINDER_GITHUB_CODEX }}
          permission-profile: ':read-only'
          output-file: /tmp/codex-review.txt
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} as an independent code reviewer.
            Inspect the complete diff using: git diff origin/${{ github.event.pull_request.base.ref }}...HEAD
            Do not edit files, post comments, or merge the pull request.
            Focus on correctness, regressions, security/privacy, tests, and maintainability.
            Return a concise GitHub-ready review as your final response.
            Clearly separate blocking findings from optional suggestions.
            If there are no blocking findings, explicitly say: AI_REVIEW_APPROVED
            If there are blocking findings, explicitly say: AI_REVIEW_CHANGES_REQUESTED

      - name: Post Codex review to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s /tmp/codex-review.txt ]; then
            echo "Codex review output is unavailable"
            exit 1
          fi

          {
            echo "## Codex AI Review"
            echo
            cat /tmp/codex-review.txt
            echo
            echo "---"
            echo "Automated review generated by the Cinder AI PR Relay. Human merge approval is still required."
          } > /tmp/codex-review.md

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/codex-review.md
