name: AI PR Relay

on:
  pull_request:
    types: [opened, labeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  relay:
    if: contains(github.event.pull_request.labels.*.name, 'ai:needs-review') && contains(github.event.pull_request.labels.*.name, 'ai:origin-codex')
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Claude reviews Codex PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} as an independent code reviewer.
            Inspect the complete diff against ${{ github.event.pull_request.base.ref }}.
            Do not edit files or merge the pull request.
            Focus on correctness, regressions, security/privacy, tests, and maintainability.
            Post your review findings to the pull request. If there are no blocking findings, clearly say that the PR is approved by the AI review.
