name: AI PR Relay

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex-origin-relay:
    if: github.event.label.name == 'ai:needs-review' && contains(github.event.pull_request.labels.*.name, 'ai:origin-codex')
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Check AI secrets
        env:
          CLAUDE_KEY: ${{ secrets.CINDER_GITHUB_CLAUDE }}
          CODEX_KEY: ${{ secrets.CINDER_GITHUB_CODEX }}
        run: |
          test -n "$CLAUDE_KEY" || { echo "CINDER_GITHUB_CLAUDE is MISSING"; exit 1; }
          test -n "$CODEX_KEY" || { echo "CINDER_GITHUB_CODEX is MISSING"; exit 1; }
          echo "Both AI relay secrets are PRESENT"

      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Mark relay reviewing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ai:reviewing --repo "$GITHUB_REPOSITORY" --color 1d76db --description "AI relay review in progress" --force
          gh label create ai:approved --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "AI review approved" --force
          gh label create ai:merge-ready --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "AI relay complete; ready for human merge" --force
          gh label create ai:human-needed --repo "$GITHUB_REPOSITORY" --color d73a4a --description "AI relay stopped; human attention needed" --force
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review --add-label ai:reviewing

      - name: Claude review round 1
        id: claude_review_1
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CINDER_GITHUB_CLAUDE }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} as an independent code reviewer, round 1 of at most 3.
            Inspect the complete diff against ${{ github.event.pull_request.base.ref }}.
            Do not edit files, post comments, or merge the pull request.
            Focus on correctness, regressions, security/privacy, tests, and maintainability.
            Return a concise GitHub-ready review as your final response.
            Clearly separate blocking findings from optional suggestions.
            If there are no blocking findings, explicitly say: AI_REVIEW_APPROVED
            If there are blocking findings, explicitly say: AI_REVIEW_CHANGES_REQUESTED

      - name: Parse and post Claude review round 1
        id: claude_parse_1
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude_review_1.outputs.execution_file }}
        run: |
          REVIEW=$(jq -r '([.[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | map(select(length > 0)) | last) // ([.[] | select(.type == "result") | .result? | select(type == "string" and length > 0)] | last) // empty' "$EXECUTION_FILE")
          test -n "$REVIEW" || { echo "Could not extract Claude review"; exit 1; }
          printf '%s\n' "$REVIEW" > /tmp/claude-review-1.txt
          if grep -q 'AI_REVIEW_APPROVED' /tmp/claude-review-1.txt; then
            echo "verdict=approved" >> "$GITHUB_OUTPUT"
          elif grep -q 'AI_REVIEW_CHANGES_REQUESTED' /tmp/claude-review-1.txt; then
            echo "verdict=changes" >> "$GITHUB_OUTPUT"
          else
            echo "Claude review did not include a relay verdict marker"; exit 1
          fi
          { echo "## Claude AI Review — Round 1"; echo; cat /tmp/claude-review-1.txt; echo; echo "---"; echo "Automated review generated by the Cinder AI PR Relay."; } > /tmp/claude-review-1.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claude-review-1.md

      - name: Build Codex fix prompt round 1
        if: steps.claude_parse_1.outputs.verdict == 'changes'
        run: |
          {
            echo "You are the originating implementation agent for pull request #$PR_NUMBER."
            echo "Address every blocking finding from the independent Claude review below."
            echo "Work only on the existing checked-out PR branch. Modify files and run appropriate tests."
            echo "Do not create another PR, do not merge, and do not commit or push; the workflow will commit and push your changes."
            echo "Preserve unrelated behavior."
            echo
            echo "Claude review findings:"
            cat /tmp/claude-review-1.txt
          } > /tmp/codex-fix-1.txt

      - name: Codex fixes round 1
        if: steps.claude_parse_1.outputs.verdict == 'changes'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CINDER_GITHUB_CODEX }}
          permission-profile: ':workspace'
          prompt-file: /tmp/codex-fix-1.txt
          output-file: /tmp/codex-fix-output-1.txt

      - name: Commit Codex fixes round 1
        if: steps.claude_parse_1.outputs.verdict == 'changes'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Codex made no file changes for requested fixes"; exit 1
          fi
          git config user.name "codex[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address AI review round 1"
          git push origin "HEAD:$HEAD_REF"

      - name: Claude review round 2
        if: steps.claude_parse_1.outputs.verdict == 'changes'
        id: claude_review_2
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CINDER_GITHUB_CLAUDE }}
          github_token: ${{ github.token }}
          prompt: |
            Re-review pull request #${{ github.event.pull_request.number }} after the originator addressed round 1 findings. This is round 2 of at most 3.
            Inspect the complete current diff against ${{ github.event.pull_request.base.ref }}.
            Do not edit files, post comments, or merge the pull request.
            Focus on correctness, regressions, security/privacy, tests, and maintainability, including whether prior blocking findings were actually resolved.
            Return a concise GitHub-ready review as your final response.
            If there are no blocking findings, explicitly say: AI_REVIEW_APPROVED
            If there are blocking findings, explicitly say: AI_REVIEW_CHANGES_REQUESTED

      - name: Parse and post Claude review round 2
        if: steps.claude_parse_1.outputs.verdict == 'changes'
        id: claude_parse_2
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude_review_2.outputs.execution_file }}
        run: |
          REVIEW=$(jq -r '([.[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | map(select(length > 0)) | last) // ([.[] | select(.type == "result") | .result? | select(type == "string" and length > 0)] | last) // empty' "$EXECUTION_FILE")
          test -n "$REVIEW" || { echo "Could not extract Claude review"; exit 1; }
          printf '%s\n' "$REVIEW" > /tmp/claude-review-2.txt
          if grep -q 'AI_REVIEW_APPROVED' /tmp/claude-review-2.txt; then echo "verdict=approved" >> "$GITHUB_OUTPUT"; elif grep -q 'AI_REVIEW_CHANGES_REQUESTED' /tmp/claude-review-2.txt; then echo "verdict=changes" >> "$GITHUB_OUTPUT"; else echo "Missing verdict marker"; exit 1; fi
          { echo "## Claude AI Review — Round 2"; echo; cat /tmp/claude-review-2.txt; echo; echo "---"; echo "Automated review generated by the Cinder AI PR Relay."; } > /tmp/claude-review-2.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claude-review-2.md

      - name: Build Codex fix prompt round 2
        if: steps.claude_parse_2.outputs.verdict == 'changes'
        run: |
          { echo "Address every blocking finding from Claude review round 2 on PR #$PR_NUMBER. Modify the existing PR branch and run appropriate tests. Do not create another PR, merge, commit, or push."; echo; cat /tmp/claude-review-2.txt; } > /tmp/codex-fix-2.txt

      - name: Codex fixes round 2
        if: steps.claude_parse_2.outputs.verdict == 'changes'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CINDER_GITHUB_CODEX }}
          permission-profile: ':workspace'
          prompt-file: /tmp/codex-fix-2.txt
          output-file: /tmp/codex-fix-output-2.txt

      - name: Commit Codex fixes round 2
        if: steps.claude_parse_2.outputs.verdict == 'changes'
        run: |
          if git diff --quiet && git diff --cached --quiet; then echo "Codex made no file changes"; exit 1; fi
          git add -A
          git commit -m "fix: address AI review round 2"
          git push origin "HEAD:$HEAD_REF"

      - name: Claude review round 3
        if: steps.claude_parse_2.outputs.verdict == 'changes'
        id: claude_review_3
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CINDER_GITHUB_CLAUDE }}
          github_token: ${{ github.token }}
          prompt: |
            Perform the final automated re-review of pull request #${{ github.event.pull_request.number }}, round 3 of 3.
            Inspect the complete current diff against ${{ github.event.pull_request.base.ref }} and verify prior blocking findings are resolved.
            Do not edit files, post comments, or merge.
            If there are no blocking findings, explicitly say: AI_REVIEW_APPROVED
            If blocking findings remain, explicitly say: AI_REVIEW_CHANGES_REQUESTED
            Return a concise GitHub-ready review.

      - name: Parse and post Claude review round 3
        if: steps.claude_parse_2.outputs.verdict == 'changes'
        id: claude_parse_3
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude_review_3.outputs.execution_file }}
        run: |
          REVIEW=$(jq -r '([.[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | map(select(length > 0)) | last) // ([.[] | select(.type == "result") | .result? | select(type == "string" and length > 0)] | last) // empty' "$EXECUTION_FILE")
          test -n "$REVIEW" || { echo "Could not extract Claude review"; exit 1; }
          printf '%s\n' "$REVIEW" > /tmp/claude-review-3.txt
          if grep -q 'AI_REVIEW_APPROVED' /tmp/claude-review-3.txt; then echo "verdict=approved" >> "$GITHUB_OUTPUT"; elif grep -q 'AI_REVIEW_CHANGES_REQUESTED' /tmp/claude-review-3.txt; then echo "verdict=changes" >> "$GITHUB_OUTPUT"; else echo "Missing verdict marker"; exit 1; fi
          { echo "## Claude AI Review — Round 3"; echo; cat /tmp/claude-review-3.txt; echo; echo "---"; echo "Automated review generated by the Cinder AI PR Relay."; } > /tmp/claude-review-3.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claude-review-3.md

      - name: Mark Codex-origin PR merge ready
        if: steps.claude_parse_1.outputs.verdict == 'approved' || steps.claude_parse_2.outputs.verdict == 'approved' || steps.claude_parse_3.outputs.verdict == 'approved'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:reviewing --add-label ai:approved --add-label ai:merge-ready
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@rmasinelli AI relay is complete: the opposite agent approved this PR. It is marked **ai:merge-ready** for your final review and merge."

      - name: Escalate Codex-origin PR after round 3
        if: steps.claude_parse_3.outputs.verdict == 'changes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:reviewing --add-label ai:human-needed
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@rmasinelli The AI relay reached the three-round limit and blocking findings remain. **Human review is needed** before continuing."

  claude-origin-relay:
    if: github.event.label.name == 'ai:needs-review' && contains(github.event.pull_request.labels.*.name, 'ai:origin-claude')
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Check AI secrets
        env:
          CLAUDE_KEY: ${{ secrets.CINDER_GITHUB_CLAUDE }}
          CODEX_KEY: ${{ secrets.CINDER_GITHUB_CODEX }}
        run: |
          test -n "$CLAUDE_KEY" || { echo "CINDER_GITHUB_CLAUDE is MISSING"; exit 1; }
          test -n "$CODEX_KEY" || { echo "CINDER_GITHUB_CODEX is MISSING"; exit 1; }
          echo "Both AI relay secrets are PRESENT"

      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Mark relay reviewing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ai:reviewing --repo "$GITHUB_REPOSITORY" --color 1d76db --description "AI relay review in progress" --force
          gh label create ai:approved --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "AI review approved" --force
          gh label create ai:merge-ready --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "AI relay complete; ready for human merge" --force
          gh label create ai:human-needed --repo "$GITHUB_REPOSITORY" --color d73a4a --description "AI relay stopped; human attention needed" --force
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review --add-label ai:reviewing

      - name: Codex review round 1
        id: codex_review_1
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CINDER_GITHUB_CODEX }}
          permission-profile: ':read-only'
          output-file: /tmp/codex-review-1.txt
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} as an independent code reviewer, round 1 of at most 3.
            Inspect the complete diff using: git diff origin/${{ github.event.pull_request.base.ref }}...HEAD
            Do not edit files, post comments, or merge.
            Focus on correctness, regressions, security/privacy, tests, and maintainability.
            Clearly separate blocking findings from optional suggestions.
            If there are no blocking findings, explicitly say: AI_REVIEW_APPROVED
            If there are blocking findings, explicitly say: AI_REVIEW_CHANGES_REQUESTED

      - name: Parse and post Codex review round 1
        id: codex_parse_1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s /tmp/codex-review-1.txt || { echo "Codex review output missing"; exit 1; }
          if grep -q 'AI_REVIEW_APPROVED' /tmp/codex-review-1.txt; then echo "verdict=approved" >> "$GITHUB_OUTPUT"; elif grep -q 'AI_REVIEW_CHANGES_REQUESTED' /tmp/codex-review-1.txt; then echo "verdict=changes" >> "$GITHUB_OUTPUT"; else echo "Missing verdict marker"; exit 1; fi
          { echo "## Codex AI Review — Round 1"; echo; cat /tmp/codex-review-1.txt; echo; echo "---"; echo "Automated review generated by the Cinder AI PR Relay."; } > /tmp/codex-review-1.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/codex-review-1.md

      - name: Record branch before Claude fix round 1
        if: steps.codex_parse_1.outputs.verdict == 'changes'
        id: before_claude_fix_1
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Claude fixes round 1
        if: steps.codex_parse_1.outputs.verdict == 'changes'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CINDER_GITHUB_CLAUDE }}
          github_token: ${{ github.token }}
          prompt: |
            You are the originating implementation agent for PR #${{ github.event.pull_request.number }}.
            Address every blocking finding from the independent Codex review below.
            Modify the existing PR branch, run appropriate tests, commit your fixes, and push them to the same PR branch.
            Do not create another PR and do not merge.

            Codex review findings:
            ${{ steps.codex_review_1.outputs.final-message }}

      - name: Sync and verify Claude fixes round 1
        if: steps.codex_parse_1.outputs.verdict == 'changes'
        run: |
          git fetch origin "$HEAD_REF"
          AFTER=$(git rev-parse "origin/$HEAD_REF")
          if [ "$AFTER" = "${{ steps.before_claude_fix_1.outputs.sha }}" ]; then echo "Claude did not push a new fix commit"; exit 1; fi
          git reset --hard "origin/$HEAD_REF"

      - name: Codex review round 2
        if: steps.codex_parse_1.outputs.verdict == 'changes'
        id: codex_review_2
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CINDER_GITHUB_CODEX }}
          permission-profile: ':read-only'
          output-file: /tmp/codex-review-2.txt
          prompt: |
            Re-review PR #${{ github.event.pull_request.number }} after the originator addressed round 1 findings. This is round 2 of at most 3.
            Inspect git diff origin/${{ github.event.pull_request.base.ref }}...HEAD and verify prior blocking findings are resolved.
            Do not edit, comment, or merge.
            If there are no blocking findings, explicitly say: AI_REVIEW_APPROVED
            If blocking findings remain, explicitly say: AI_REVIEW_CHANGES_REQUESTED
            Return a concise GitHub-ready review.

      - name: Parse and post Codex review round 2
        if: steps.codex_parse_1.outputs.verdict == 'changes'
        id: codex_parse_2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s /tmp/codex-review-2.txt || { echo "Codex review output missing"; exit 1; }
          if grep -q 'AI_REVIEW_APPROVED' /tmp/codex-review-2.txt; then echo "verdict=approved" >> "$GITHUB_OUTPUT"; elif grep -q 'AI_REVIEW_CHANGES_REQUESTED' /tmp/codex-review-2.txt; then echo "verdict=changes" >> "$GITHUB_OUTPUT"; else echo "Missing verdict marker"; exit 1; fi
          { echo "## Codex AI Review — Round 2"; echo; cat /tmp/codex-review-2.txt; echo; echo "---"; echo "Automated review generated by the Cinder AI PR Relay."; } > /tmp/codex-review-2.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/codex-review-2.md

      - name: Record branch before Claude fix round 2
        if: steps.codex_parse_2.outputs.verdict == 'changes'
        id: before_claude_fix_2
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Claude fixes round 2
        if: steps.codex_parse_2.outputs.verdict == 'changes'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CINDER_GITHUB_CLAUDE }}
          github_token: ${{ github.token }}
          prompt: |
            Address every remaining blocking finding from Codex review round 2 on PR #${{ github.event.pull_request.number }}.
            Modify the existing PR branch, run appropriate tests, commit your fixes, and push them to the same branch. Do not create another PR or merge.

            Codex review findings:
            ${{ steps.codex_review_2.outputs.final-message }}

      - name: Sync and verify Claude fixes round 2
        if: steps.codex_parse_2.outputs.verdict == 'changes'
        run: |
          git fetch origin "$HEAD_REF"
          AFTER=$(git rev-parse "origin/$HEAD_REF")
          if [ "$AFTER" = "${{ steps.before_claude_fix_2.outputs.sha }}" ]; then echo "Claude did not push a new fix commit"; exit 1; fi
          git reset --hard "origin/$HEAD_REF"

      - name: Codex review round 3
        if: steps.codex_parse_2.outputs.verdict == 'changes'
        id: codex_review_3
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CINDER_GITHUB_CODEX }}
          permission-profile: ':read-only'
          output-file: /tmp/codex-review-3.txt
          prompt: |
            Perform the final automated re-review of PR #${{ github.event.pull_request.number }}, round 3 of 3.
            Inspect git diff origin/${{ github.event.pull_request.base.ref }}...HEAD and verify prior blocking findings are resolved.
            Do not edit, comment, or merge.
            If there are no blocking findings, explicitly say: AI_REVIEW_APPROVED
            If blocking findings remain, explicitly say: AI_REVIEW_CHANGES_REQUESTED
            Return a concise GitHub-ready review.

      - name: Parse and post Codex review round 3
        if: steps.codex_parse_2.outputs.verdict == 'changes'
        id: codex_parse_3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s /tmp/codex-review-3.txt || { echo "Codex review output missing"; exit 1; }
          if grep -q 'AI_REVIEW_APPROVED' /tmp/codex-review-3.txt; then echo "verdict=approved" >> "$GITHUB_OUTPUT"; elif grep -q 'AI_REVIEW_CHANGES_REQUESTED' /tmp/codex-review-3.txt; then echo "verdict=changes" >> "$GITHUB_OUTPUT"; else echo "Missing verdict marker"; exit 1; fi
          { echo "## Codex AI Review — Round 3"; echo; cat /tmp/codex-review-3.txt; echo; echo "---"; echo "Automated review generated by the Cinder AI PR Relay."; } > /tmp/codex-review-3.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/codex-review-3.md

      - name: Mark Claude-origin PR merge ready
        if: steps.codex_parse_1.outputs.verdict == 'approved' || steps.codex_parse_2.outputs.verdict == 'approved' || steps.codex_parse_3.outputs.verdict == 'approved'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:reviewing --add-label ai:approved --add-label ai:merge-ready
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@rmasinelli AI relay is complete: the opposite agent approved this PR. It is marked **ai:merge-ready** for your final review and merge."

      - name: Escalate Claude-origin PR after round 3
        if: steps.codex_parse_3.outputs.verdict == 'changes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:reviewing --add-label ai:human-needed
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@rmasinelli The AI relay reached the three-round limit and blocking findings remain. **Human review is needed** before continuing."
