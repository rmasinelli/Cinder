name: AI PR Relay

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  prepare:
    if: github.event.label.name == 'ai:needs-review'
    runs-on: ubuntu-latest
    outputs:
      origin: ${{ steps.origin.outputs.origin }}
    steps:
      - name: Resolve AI origin
        id: origin
        env:
          HAS_CODEX: ${{ contains(github.event.pull_request.labels.*.name, 'ai:origin-codex') }}
          HAS_CLAUDE: ${{ contains(github.event.pull_request.labels.*.name, 'ai:origin-claude') }}
        run: |
          set -euo pipefail
          if [ "$HAS_CODEX" = true ] && [ "$HAS_CLAUDE" = false ]; then
            echo 'origin=codex' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CLAUDE" = true ] && [ "$HAS_CODEX" = false ]; then
            echo 'origin=claude' >> "$GITHUB_OUTPUT"
          else
            echo 'PR must have exactly one AI origin label.' >&2
            exit 1
          fi

      - name: Check AI secrets
        env:
          CLAUDE_KEY: ${{ secrets.CINDER_GITHUB_CLAUDE }}
          CODEX_KEY: ${{ secrets.CINDER_GITHUB_CODEX }}
        run: |
          test -n "$CLAUDE_KEY" || { echo 'CINDER_GITHUB_CLAUDE is MISSING'; exit 1; }
          test -n "$CODEX_KEY" || { echo 'CINDER_GITHUB_CODEX is MISSING'; exit 1; }

      - name: Mark relay reviewing
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create ai:reviewing --repo "$GITHUB_REPOSITORY" --color 1d76db --description 'AI relay review in progress' --force
          gh label create ai:approved --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description 'AI review approved' --force
          gh label create ai:merge-ready --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description 'AI relay complete; ready for human merge' --force
          gh label create ai:human-needed --repo "$GITHUB_REPOSITORY" --color d73a4a --description 'AI relay stopped; human attention needed' --force
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review --add-label ai:reviewing

  review_1:
    needs: prepare
    uses: ./.github/workflows/ai-review-round.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      origin: ${{ needs.prepare.outputs.origin }}
      round: 1
    secrets:
      OPENAI_API_KEY: ${{ secrets.CINDER_GITHUB_CODEX }}
      ANTHROPIC_API_KEY: ${{ secrets.CINDER_GITHUB_CLAUDE }}

  fix_1:
    needs: [prepare, review_1]
    if: needs.review_1.outputs.decision == 'changes_requested'
    uses: ./.github/workflows/ai-fix-round.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      origin: ${{ needs.prepare.outputs.origin }}
      round: 1
      review: ${{ needs.review_1.outputs.review }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.CINDER_GITHUB_CODEX }}
      ANTHROPIC_API_KEY: ${{ secrets.CINDER_GITHUB_CLAUDE }}

  review_2:
    needs: [prepare, review_1, fix_1]
    if: needs.review_1.outputs.decision == 'changes_requested' && needs.fix_1.result == 'success'
    uses: ./.github/workflows/ai-review-round.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      origin: ${{ needs.prepare.outputs.origin }}
      round: 2
    secrets:
      OPENAI_API_KEY: ${{ secrets.CINDER_GITHUB_CODEX }}
      ANTHROPIC_API_KEY: ${{ secrets.CINDER_GITHUB_CLAUDE }}

  fix_2:
    needs: [prepare, review_2]
    if: needs.review_2.outputs.decision == 'changes_requested'
    uses: ./.github/workflows/ai-fix-round.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      origin: ${{ needs.prepare.outputs.origin }}
      round: 2
      review: ${{ needs.review_2.outputs.review }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.CINDER_GITHUB_CODEX }}
      ANTHROPIC_API_KEY: ${{ secrets.CINDER_GITHUB_CLAUDE }}

  review_3:
    needs: [prepare, review_2, fix_2]
    if: needs.review_2.outputs.decision == 'changes_requested' && needs.fix_2.result == 'success'
    uses: ./.github/workflows/ai-review-round.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      origin: ${{ needs.prepare.outputs.origin }}
      round: 3
    secrets:
      OPENAI_API_KEY: ${{ secrets.CINDER_GITHUB_CODEX }}
      ANTHROPIC_API_KEY: ${{ secrets.CINDER_GITHUB_CLAUDE }}

  finalize:
    needs: [prepare, review_1, fix_1, review_2, fix_2, review_3]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREP_RESULT: ${{ needs.prepare.result }}
      R1_RESULT: ${{ needs.review_1.result }}
      R1_DECISION: ${{ needs.review_1.outputs.decision }}
      F1_RESULT: ${{ needs.fix_1.result }}
      R2_RESULT: ${{ needs.review_2.result }}
      R2_DECISION: ${{ needs.review_2.outputs.decision }}
      F2_RESULT: ${{ needs.fix_2.result }}
      R3_RESULT: ${{ needs.review_3.result }}
      R3_DECISION: ${{ needs.review_3.outputs.decision }}
    steps:
      - name: Finalize relay state
        run: |
          set -euo pipefail

          if [ "$R1_DECISION" = approved ] || [ "$R2_DECISION" = approved ] || [ "$R3_DECISION" = approved ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:reviewing --add-label ai:approved --add-label ai:merge-ready
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body '@rmasinelli AI relay is complete: the opposite agent approved this PR. It is marked **ai:merge-ready** for your final review and merge.'
            exit 0
          fi

          if [ "$R3_DECISION" = changes_requested ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:reviewing --add-label ai:human-needed
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body '@rmasinelli The AI relay reached the three-round limit and blocking findings remain. **Human review is needed** before continuing.'
            exit 0
          fi

          for result in "$PREP_RESULT" "$R1_RESULT" "$F1_RESULT" "$R2_RESULT" "$F2_RESULT" "$R3_RESULT"; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:reviewing --add-label ai:human-needed || true
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@rmasinelli The AI relay stopped because an automated review/fix job failed or was cancelled. The PR is marked **ai:human-needed** instead of being left in an in-progress state."
              exit 0
            fi
          done

          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ai:reviewing --add-label ai:human-needed || true
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body '@rmasinelli The AI relay ended in an unexpected state. The PR is marked **ai:human-needed** for inspection.'
